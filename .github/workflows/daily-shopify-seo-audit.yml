name: Daily OxiSure SEO Keyword Suggestions, Issue Audit & Care Guide Timer

on:
  schedule:
    # Runs daily at 05:30 UTC (1:30 PM PHT) alongside Supabase pg_cron
    - cron: '30 5 * * *'
  workflow_dispatch:

jobs:
  run-seo-audit-and-keyword-timer:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger OxiSure SEO Audit, Keyword Suggestions & Care Guide Pipeline
        run: |
          echo "Triggering OxiSure Shopify SEO Audit + Keyword Suggestion + Auto-Blog Remediation..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            "https://hoqzujbwyphxzikuknsk.supabase.co/functions/v1/shopify-seo-audit" \
            -H "Content-Type: application/json" \
            -d '{"source": "github_actions_daily_cron", "chain_auto_blog": true}')
          BODY=$(echo "$RESPONSE" | sed -e 's/HTTP_STATUS\:.*//g')
          STATUS=$(echo "$RESPONSE" | tr -d '\n' | sed -e 's/.*HTTP_STATUS://')
          echo "HTTP Status: $STATUS"
          echo "$BODY" | jq . || echo "$BODY"
          if [ "$STATUS" -ne 200 ]; then
            echo "SEO Audit & Keyword Timer returned non-200 status: $STATUS"
            exit 1
          fi
